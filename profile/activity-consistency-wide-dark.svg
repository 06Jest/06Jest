<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" data-format="activity-consistency" data-period-days="365" role="img" aria-labelledby="title-activity-consistency-wide-dark desc-activity-consistency-wide-dark"><title id="title-activity-consistency-wide-dark">06Jest activity consistency · wide</title><desc id="desc-activity-consistency-wide-dark">63 active days out of 365; 4-day current streak; 12-day longest streak; 400 contributions. Each daily mark represents one UTC day and warmth represents contribution amount.</desc><rect width="640" height="360" fill="#151821"/><rect x="0.5" y="0.5" width="639" height="359" fill="none" stroke="#303543"/><text x="28" y="31" fill="#F7F3EA" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.4">06Jest · ACTIVITY / CONSISTENCY</text><text x="612" y="31" fill="#AAA8B4" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" font-weight="600" text-anchor="end">SEP 05, 2025 — SEP 04, 2026</text><text x="28" y="130" fill="#F7F3EA" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="86" font-weight="700" letter-spacing="-4">63</text><text x="88" y="88" fill="#AAA8B4" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="680">/ 365</text><text x="88" y="118" fill="#F7F3EA" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700">ACTIVE DAYS</text><path d="M290 66L290 137" stroke="#303543"/><text x="320" y="105" fill="#F08A5B" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="43" font-weight="700">4</text><text x="320" y="126" fill="#AAA8B4" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650">CURRENT STREAK · DAYS</text>