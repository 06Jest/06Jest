name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: stats
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Copy generated stats
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$READY_DIR"/activity-consistency-*.svg profile/

      - name: Remove contribution graphs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for path in Path("profile").glob("activity-consistency-*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Remove contribution cells.
              svg = re.sub(
                  r'<rect\b[^>]*data-date="[^"]*"[^>]*/>\s*',
                  '',
                  svg
              )

              # Remove contribution legend labels.
              svg = re.sub(
                  r'<text\b[^>]*>(?:LESS|MORE)</text>\s*',
                  '',
                  svg
              )

              # Remove contribution legend squares.
              svg = re.sub(
                  r'<rect\b[^>]*data-legend-level="[^"]*"[^>]*/>\s*',
                  '',
                  svg
              )

              # Remove contribution total.
              svg = re.sub(
                  r'<text\b[^>]*>395 CONTRIBUTIONS · PAST YEAR</text>\s*',
                  '',
                  svg
              )

              path.write_text(svg, encoding="utf-8")
          PY

      - name: Verify artifacts
        run: |
          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/activity-consistency-compact-light.svg
          test -s profile/activity-consistency-compact-dark.svg

      - name: Publish changed artifact set
        run: |
          git add profile/activity-consistency-*.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git commit -m "Update profile stats"
          git push
