name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate activity cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate-activity-card.py

      - name: Verify artifacts
        run: |
          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-wide-dark.svg

      - name: Publish changed artifact set
        run: |
          git add profile/activity-consistency-*.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git commit -m "Update profile stats"
          git push
